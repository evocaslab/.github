# Hooks run by prek: `prek install` adds the git hook, `prek run --all-files` is the gate (also the `gate` CI job).
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]

-   repo: https://github.com/igorshubovych/markdownlint-cli
    # Structural checks only; the rules are configured in .markdownlint.yaml.
    rev: v0.50.0
    hooks:
    -   id: markdownlint

-   repo: https://github.com/gitleaks/gitleaks
    # Secret scanning of the staged changes (all files in CI).
    rev: v8.30.1
    hooks:
    -   id: gitleaks
