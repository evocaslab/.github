# Hooks run by prek: `prek install` adds the git hook, `prek run --all-files` is the gate (also the `gate` CI job).
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]

-   repo: https://github.com/igorshubovych/markdownlint-cli
    # Structural checks only; the rules are configured in .markdownlint.yaml.
    rev: v0.50.0
    hooks:
    -   id: markdownlint

-   repo: https://github.com/gitleaks/gitleaks
    # Secret scanning of the staged changes (all files in CI).
    rev: v8.30.1
    hooks:
    -   id: gitleaks

-   repo: local
    # needs.yaml (HQ practices/needs-by-context.md); scripts/needs.py is vendored from HQ, byte-identical.
    hooks:
    -   id: needs-lint
        name: needs.yaml is valid
        entry: uv run --script scripts/needs.py lint
        language: system
        pass_filenames: false
        files: ^(needs\.yaml|scripts/needs\.py)$
    -   id: needs-render
        name: README needs table is current
        entry: uv run --script scripts/needs.py render --check
        language: system
        pass_filenames: false
        files: ^(needs\.yaml|README\.md|scripts/needs\.py)$
